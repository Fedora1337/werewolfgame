<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Sói - Moderator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e74c3c; margin-bottom: 30px; }
        .container { max-width: 500px; margin: 0 auto; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: white;
            box-sizing: border-box;
            font-size: 16px; /* Prevent iOS zoom */
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            margin: 10px 0;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }

        .lobby {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .player-card {
            padding: 10px;
            border-radius: 12px;
            background: #2a2a2a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .player-card img { border-radius: 50%; width: 50px; height: 50px; }
        .player-card p { margin: 5px 0 0 0; font-size: 0.8em; overflow: hidden; text-overflow: ellipsis; }

        .role-result {
            margin-top: 30px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 12px;
            text-align: left;
        }
        .role-item {
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .role-item:last-child { border-bottom: none; }

        #displayRoomCode { font-family: monospace; letter-spacing: 3px; }
    </style>
</head>
<body>
    <div id="night-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h1 style="color: #f1c40f; font-size: 3em;">🌙</h1>
        <h2 style="color: white;">Trời tối rồi...</h2>
        <p style="color: #666;">Mọi người nhắm mắt lại!</p>
        <button onclick="document.getElementById('night-overlay').style.display='none'" style="width: auto; background: #333; margin-top: 50px;">Xem vai / chức năng</button>
    </div>

    <div id="timer-display" style="display: none; position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 500; font-size: 0.8em; border: 1px solid #e74c3c; width: 150px; text-align: left;">
        Trò chơi sẽ tự động bắt đầu sau: <span id="seconds" style="color: #e74c3c; font-weight: bold;">300</span>s
    </div>

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <div class="container">
        <h1>Môn Sói Là</h1>

        <!-- Login Section -->
        <div id="login-section">
            <p>Đăng nhập để lấy Avatar và Tên xịn</p>
            <div id="g_id_onload"
                 data-client_id="10011358335-gn9mrfr7fi460d11u1a55kf2jtvuopo5.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>

        <div id="game-section" style="display: none;">
            <h2>Mã Phòng: <span id="displayRoomCode" style="color: #f1c40f;">######</span></h2>
            <div id="current-phase" style="color: #f1c40f; font-weight: bold; margin-bottom: 10px;">Giai đoạn: LOBBY</div>
            <div class="lobby" id="playerList">
                <!-- Players show here -->
            </div>

            <div id="host-controls" style="display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid #333;">
                <label style="display: block; margin-bottom: 10px;">Cấu hình trận đấu:</label>
                <select id="ratioSelect" style="width: 100%; padding: 12px; border-radius: 8px; background: #1e1e1e; color: white; border: 1px solid #333;">
                    <option value="0.25">Tỷ lệ Sói: 25% (Ít Sói)</option>
                    <option value="0.33">Tỷ lệ Sói: 33% (Nhiều Sói)</option>
                </select>
                <button id="btnStart" onclick="distributeRoles()" style="background: #27ae60; margin-top: 20px;">BẮT ĐẦU GAME</button>
                <button id="btnNextPhase" onclick="nextPhase()" style="display: none; background: #f39c12;">CHUYỂN SANG NGÀY/ĐÊM</button>
            </div>
        </div>

        <div id="result" class="role-result" style="display: none;"></div>
    </div>

    <script>
        let myId = null;
        let myName = "";
        let myAvatar = "";
        let currentRoomCode = null;
        let isHost = false;
        let socket = null;
        let countdownInterval = null;

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            myId = responsePayload.sub;
            myName = responsePayload.name;
            myAvatar = responsePayload.picture;

            localStorage.setItem('werewolf_user', JSON.stringify({
                id: myId,
                name: myName,
                avatar: myAvatar
            }));

            showLobbyControls();
        }

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function showLobbyControls() {
            document.getElementById('login-section').innerHTML = `
                <div id="user-info" style="margin-bottom: 20px; background: #2a2a2a; padding: 15px; border-radius: 12px; border: 1px solid #444;">
                    <div id="profile-display">
                        <img id="myAvatar" src="${myAvatar}" width="60" height="60" style="border-radius: 50%; border: 2px solid #e74c3c; object-fit: cover;">
                        <p id="myName" style="font-weight: bold; margin: 10px 0; font-size: 1.2em;">${myName}</p>
                        <button onclick="toggleEditProfile()" style="width: auto; padding: 5px 15px; font-size: 0.8em; background: #555;">Chỉnh sửa Profile</button>
                    </div>
                    <div id="profile-edit" style="display: none;">
                        <input type="text" id="editName" value="${myName}" placeholder="Tên hiển thị...">
                        <input type="text" id="editAvatar" value="${myAvatar}" placeholder="Link ảnh đại diện (URL)...">
                        <div style="display: flex; gap: 10px;">
                            <button onclick="saveProfile()" style="background: #27ae60;">Lưu</button>
                            <button onclick="toggleEditProfile()" style="background: #7f8c8d;">Hủy</button>
                        </div>
                    </div>
                </div>
                <button onclick="createRoom()" style="background: #2980b9;">Tạo Phòng Mới</button>
                <div style="margin: 20px 0; color: #666;">— HOẶC —</div>
                <input type="text" id="roomCodeInput" inputmode="numeric" pattern="[0-9]*" placeholder="Nhập mã phòng (6 số)...">
                <button onclick="joinRoom()">Gia Nhập Phòng</button>
            `;
        }

        function toggleEditProfile() {
            const display = document.getElementById('profile-display');
            const edit = document.getElementById('profile-edit');
            if (display.style.display === 'none') {
                display.style.display = 'block';
                edit.style.display = 'none';
            } else {
                display.style.display = 'none';
                edit.style.display = 'block';
            }
        }

        function saveProfile() {
            const newName = document.getElementById('editName').value.trim();
            const newAvatar = document.getElementById('editAvatar').value.trim();

            if (!newName || !newAvatar) return alert("Không được để trống tên hoặc ảnh!");

            myName = newName;
            myAvatar = newAvatar;

            localStorage.setItem('werewolf_user', JSON.stringify({
                id: myId,
                name: myName,
                avatar: myAvatar
            }));

            // Nếu đang trong phòng, gửi cập nhật lên server
            if (currentRoomCode && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "UPDATE_PROFILE",
                    data: JSON.stringify({ name: myName, avatar: myAvatar })
                }));
            }

            showLobbyControls();
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('werewolf_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                myId = user.id;
                myName = user.name;
                myAvatar = user.avatar;
                showLobbyControls();
            }
        };

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/${myId}`);

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "PLAYER_LIST_UPDATE") {
                    updatePlayerListUI(JSON.parse(msg.data));
                } else if (msg.type === "YOUR_ROLE") {
                    displayMyRole(JSON.parse(msg.data));
                } else if (msg.type === "PHASE_UPDATE") {
                    handlePhaseUpdate(msg.data);
                }
            };

            socket.onclose = () => {
                setTimeout(connectWebSocket, 1000);
            };
        }

        async function createRoom() {
            if (!myId) return alert("Vui lòng đăng nhập!");
            const response = await fetch('/create-room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: myId, name: myName, avatar: myAvatar })
            });
            const room = await response.json();
            setupRoom(room, true);
        }

        async function joinRoom() {
            const code = document.getElementById('roomCodeInput').value;
            if (!myId || !code) return alert("Vui lòng nhập mã phòng!");
            const response = await fetch(\`/join-room/$\{code}\`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: myId, name: myName, avatar: myAvatar })
            });
            if (response.ok) {
                const room = await response.json();
                setupRoom(room, false);
            } else {
                alert("Không tìm thấy phòng!");
            }
        }

        function setupRoom(room, host) {
            currentRoomCode = room.code;
            isHost = host;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
            document.getElementById('displayRoomCode').innerText = room.code;
            if (isHost) document.getElementById('host-controls').style.display = 'block';
            connectWebSocket();
            refreshPlayers();
        }

        function updatePlayerListUI(players) {
            const list = document.getElementById('playerList');
            list.innerHTML = players.map(p => `
                <div class="player-card">
                    <img src="${p.avatar}" width="50" height="50">
                    <p>${p.name}</p>
                </div>
            `).join('');
        }

        async function refreshPlayers() {
            if (!currentRoomCode) return;
            const response = await fetch(\`/room/$\{currentRoomCode\}/players\`);
            const players = await response.json();
            updatePlayerListUI(players);
        }

        function displayMyRole(assignment) {
            if (window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]);
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            const roleIcons = {
                'WEREWOLF': '🐺', 'VILLAGER': '👨‍🌾', 'SEER': '🔮',
                'DOCTOR': '🛡️', 'HUNTER': '🔫', 'WITCH': '🧪', 'CUPID': '🏹'
            };
            resultDiv.innerHTML = `
                <div style="text-align: center; border: 2px solid #f1c40f; padding: 20px; border-radius: 15px; background: #2c3e50;">
                    <h2 style="color: #f1c40f;">VAI DIỄN CỦA BẠN</h2>
                    <div style="font-size: 5em; margin: 10px 0;">$\{roleIcons[assignment.role] || '👤'}</div>
                    <h1 style="color: $\{assignment.role === 'WEREWOLF' ? '#ff4d4d' : '#4da6ff'};">$\{assignment.role}</h1>
                    <p style="color: #bdc3c7;">$\{assignment.description}</p>
                    <button id="btnUnderstand" onclick="confirmUnderstand()" style="background: #e74c3c;">TÔI ĐÃ HIỂU</button>
                </div>
            `;
        }

        function confirmUnderstand() {
            const btn = document.getElementById('btnUnderstand');
            btn.style.background = '#27ae60'; btn.innerText = 'ĐÃ XÁC NHẬN'; btn.disabled = true;
            socket.send(JSON.stringify({type: "I_UNDERSTAND", data: ""}));
        }

        function handlePhaseUpdate(phase) {
            document.getElementById('current-phase').innerText = "Giai đoạn: " + phase;
            if (phase === "PREPARING") startCountdown(300);
            else if (phase === "NIGHT") {
                clearInterval(countdownInterval);
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('night-overlay').style.display = 'flex';
            } else document.getElementById('night-overlay').style.display = 'none';

            if (isHost) {
                document.getElementById('btnStart').style.display = phase === "LOBBY" ? "block" : "none";
                document.getElementById('btnNextPhase').style.display = phase !== "LOBBY" ? "block" : "none";
            }
        }

        async function nextPhase() { await fetch(\`/room/$\{currentRoomCode\}/next-phase\`, { method: 'POST' }); }
        async function distributeRoles() {
            const ratio = document.getElementById('ratioSelect').value;
            const response = await fetch(`/room/${currentRoomCode}/distribute?ratio=${ratio}`);
            if (!response.ok) {
                const errorMsg = await response.text();
                alert(errorMsg);
            }
        }
        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            document.getElementById('timer-display').style.display = 'block';
            document.getElementById('seconds').innerText = timeLeft;
            countdownInterval = setInterval(() => {
                timeLeft--; document.getElementById('seconds').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(countdownInterval); if (isHost) nextPhase(); }
            }, 1000);
        }
    </script>
</body>
</html>
