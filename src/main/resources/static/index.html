<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môn Sói Là - Game Ma Sói Online</title>
    <style>
        :root { --primary: #e74c3c; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; }

        /* UI Components */
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: var(--primary); font-size: 2.5em; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; font-weight: bold; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px; margin: 10px 0; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
        .secondary-btn { background: #2980b9; }
        .ghost-btn { background: #333; font-size: 0.9em; padding: 8px; border: 1px solid #444; }

        /* Pages */
        .page { display: none; flex: 1; flex-direction: column; justify-content: center; }
        .page.active { display: flex; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; text-align: left; }
        .gallery-card {
            background: #1a1a1a;
            padding: 0;
            border-radius: 12px;
            border: 2px solid #d4af37; /* Viền màu vàng đồng cổ điển */
            display: flex;
            flex-direction: column; /* Ảnh trên, text dưới */
            align-items: stretch;
            gap: 0;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        .gallery-card .card-img {
            width: 100%;
            height: 370px; /* Tăng thêm để bù phần cắt */
            object-fit: cover;
            margin-top: -20px; /* Đẩy lên 1/20 để giấu tag AI phía trên */
            border-right: none;
            border-bottom: 2px solid #d4af37;
        }
        .gallery-card .card-info { padding: 15px; flex: 1; }
        .gallery-card h4 { margin: 0; color: #d4af37; font-family: 'Georgia', serif; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }
        .gallery-card p { margin: 8px 0 0 0; font-size: 0.85em; color: #ccc; line-height: 1.5; font-style: italic; }

        /* Role Popup - Phong cách Thẻ bài lớn */
        .role-card-big {
            background: #1a1a1a;
            border: 4px solid #d4af37;
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            max-width: 350px;
            margin: 50px auto;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
        }
        .role-card-big img {
            width: 100%;
            height: 320px; /* Tăng thêm để bù phần cắt */
            object-fit: cover;
            margin-top: -20px; /* Đẩy lên 1/20 để giấu tag AI phía trên */
            border-bottom: 3px solid #d4af37;
        }
        .role-card-content { padding: 25px; }

        /* Lobby Grid */
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin-top: 20px; }
        .player-card { background: #2a2a2a; padding: 10px; border-radius: 12px; border: 1px solid #444; position: relative; }
        .player-card.ready { border-color: #27ae60; box-shadow: 0 0 10px rgba(39, 174, 96, 0.4); }
        .player-card.ready::after { content: '✓'; position: absolute; top: -5px; right: -5px; background: #27ae60; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
        .player-card img { border-radius: 50%; width: 50px; height: 50px; object-fit: cover; border: 2px solid #555; }

        /* Night Overlay */
        #night-overlay { position: fixed; inset: 0; background: black; z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; }

        /* Role Card */
        .role-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1500; display: none; padding: 40px 20px; overflow-y: auto; }

        #timer-display { position: fixed; top: 10px; left: 10px; background: rgba(231, 76, 60, 0.2); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--primary); font-size: 0.8em; z-index: 2500; }
    </style>
</head>
<body>
    <div id="night-overlay">
        <h1 style="font-size: 5em;">🌙</h1>
        <h2>Trời tối rồi...</h2>
        <p style="color: #888;">Mọi người vui lòng nhắm mắt lại!</p>
        <button onclick="document.getElementById('night-overlay').style.display='none'" class="ghost-btn" style="width: auto; margin-top: 40px;">Lén xem vai</button>
    </div>

    <div id="timer-display" style="display: none;">🕒 <span id="seconds">300</span>s</div>

    <div class="container">
        <!-- PAGE: HOME (Intro + Login) -->
        <div id="page-home" class="page active">
            <h1>Môn Sói Là</h1>
            <p style="color: #888; margin-bottom: 40px;">Game đấu trí phong cách Werewolf.</p>
            <div class="card">
                <h3>Vào game ngay</h3>
                <div id="g_id_onload" data-client_id="10011358335-gn9mrfr7fi460d11u1a55kf2jtvuopo5.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
                <div class="g_id_signin" data-type="standard" data-shape="rectangular"></div>
            </div>
            <button onclick="showGallery()" class="ghost-btn" style="width: auto; margin: 20px auto;">📖 Xem bộ bài</button>
        </div>

        <!-- PAGE: DASHBOARD (Profile + Create/Join) -->
        <div id="page-dashboard" class="page">
            <div class="card">
                <div id="profile-display">
                    <img id="myAvatar" src="" width="80" height="80" style="border-radius: 50%; border: 3px solid var(--primary);">
                    <h2 id="myName" style="margin: 10px 0;">User Name</h2>
                    <button onclick="toggleEdit(true)" class="ghost-btn" style="width: auto;">Chỉnh sửa Profile</button>
                </div>
                <div id="profile-edit" style="display: none;">
                    <div style="text-align: left; margin-bottom: 15px;">
                        <label style="font-size: 0.8em; color: #888;">NHẬP TÊN HIỂN THỊ</label>
                        <input type="text" id="editName" placeholder="Tên của bạn...">
                    </div>

                    <div style="text-align: left; margin-bottom: 15px;">
                        <label style="font-size: 0.8em; color: #888;">AVATAR</label>
                        <input type="file" id="fileAvatar" accept="image/*" style="font-size: 0.8em; padding: 8px;">
                        <p style="font-size: 0.7em; color: #555; margin: 5px 0;">Hoặc dán URL ảnh trực tiếp vào đây:</p>
                        <input type="text" id="editAvatar" placeholder="http://...">
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button onclick="saveProfile()" style="background: #27ae60;">Lưu</button>
                        <button onclick="toggleEdit(false)" class="ghost-btn">Hủy</button>
                    </div>
                </div>
            </div>
            <button onclick="createRoom()" class="secondary-btn">Tạo Phòng Mới</button>
            <div style="margin: 10px; color: #555;">— HOẶC —</div>
            <input type="text" id="roomCodeInput" inputmode="numeric" placeholder="Mã phòng (6 số)...">
            <button onclick="joinRoom()">Gia Nhập Phòng</button>
            <button onclick="showGallery()" class="ghost-btn" style="width: auto; margin-top: 20px;">📖 Thư viện bài</button>
        </div>

        <!-- PAGE: GALLERY -->
        <div id="page-gallery" class="page">
            <h2 style="color: #f1c40f;">Bộ Bài Môn Sói Là</h2>
            <div class="card" style="flex: 1; overflow-y: auto; text-align: left;">
                <div class="gallery-grid" id="galleryList">
                    <!-- Roles will be injected here -->
                </div>
            </div>
            <button onclick="backFromGallery()" class="ghost-btn">Quay lại</button>
        </div>

        <!-- PAGE: LOBBY (Player List) -->
        <div id="page-lobby" class="page">
            <div style="margin-bottom: 20px;">
                <h2 style="margin: 0;">Mã Phòng: <span id="displayRoomCode" style="color: #f1c40f; letter-spacing: 2px;">######</span></h2>
                <p id="current-phase" style="color: #f1c40f; font-size: 0.9em; font-weight: bold; margin-top: 5px;">Giai đoạn: LOBBY</p>
            </div>

            <div class="card" style="flex: 1; overflow-y: auto; min-height: 200px;">
                <div id="player-count-badge" style="background: #333; padding: 5px 10px; border-radius: 10px; display: inline-block; font-size: 0.8em; margin-bottom: 10px;">Đang chờ: 0/8 người</div>
                <div class="player-grid" id="playerList"></div>
            </div>

            <div id="host-controls" style="display: none;">
                <label style="font-size: 0.8em; color: #888;">CẤU HÌNH TRẬN ĐẤU</label>
                <select id="ratioSelect" style="width: 100%; padding: 12px; border-radius: 8px; background: #222; color: white; margin: 10px 0; border: 1px solid #444;">
                    <option value="0.25">Tỷ lệ Sói: 25% (Newbie)</option>
                    <option value="0.33">Tỷ lệ Sói: 33% (Standard)</option>
                </select>
                <button id="btnStartGame" onclick="distributeRoles()" style="background: #27ae60;">BẮT ĐẦU GAME</button>
            </div>
            <button id="btnReady" onclick="toggleReady()" style="display: none; background: #2980b9;">SẴN SÀNG</button>
            <button id="btnNextPhase" onclick="nextPhase()" style="display: none; background: #f39c12;">SANG NGÀY/ĐÊM TIẾP THEO</button>
            <button onclick="leaveRoom()" class="ghost-btn" style="border-color: #e74c3c; color: #e74c3c; margin-top: 20px; border: 1px solid #e74c3c;">RỜI PHÒNG CHỜ</button>
        </div>
    </div>

    <!-- ROLE POPUP -->
    <div id="role-popup" class="role-popup">
        <div id="result"></div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        let myId, myName, myAvatar, currentRoomCode, isHost = false, socket = null, countdownInterval = null;
        let lastPage = 'page-home';

        const allRoles = [
            { role: 'WEREWOLF', image: 'https://images.unsplash.com/photo-1550747528-cdb8d030f302?q=80&w=400', description: 'Ma Sói - Ăn thịt dân làng mỗi đêm. Hãy cố gắng ẩn mình và tiêu diệt phe dân làng.' },
            { role: 'VILLAGER', image: 'images/roles/thevillager.png', description: 'Dân Làng - Không có chức năng đặc biệt. Hãy dùng khả năng lập luận để tìm ra sói và treo cổ chúng.' },
            { role: 'SEER', image: 'images/roles/theseer.png', description: 'Tiên Tri - Mỗi đêm được soi danh tính của một người chơi. Hãy dùng thông tin đó dẫn dắt làng.' },
            { role: 'DOCTOR', image: 'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=400', description: 'Bảo Vệ - Mỗi đêm chọn một người để bảo vệ khỏi sự tấn công của sói. Không thể bảo vệ chính mình 2 đêm liên tiếp.' },
            { role: 'HUNTER', image: 'https://images.unsplash.com/photo-1590424753858-394a12a5ecba?q=80&w=400', description: 'Thợ Săn - Khi bị chết (treo cổ hoặc bị cắn), được phép nổ súng bắn một người chơi khác đi theo.' },
            { role: 'WITCH', image: 'images/roles/thewitch.png', description: 'Phù Thủy - Có 2 bình thuốc: 1 bình thuốc cứu người bị cắn và 1 bình thuốc độc để giết kẻ tình nghi.' },
            { role: 'CUPID', image: 'https://images.unsplash.com/photo-1518131394553-c3fd6647990b?q=80&w=400', description: 'Thần Tình Yêu - Đêm đầu tiên chọn 2 người để ghép đôi. Nếu 1 người chết, người kia sẽ chết theo vì đau lòng.' }
        ];

        function navigateTo(pageId) {
            if (pageId !== 'page-gallery') lastPage = pageId;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function showGallery() {
            const list = document.getElementById('galleryList');
            list.innerHTML = allRoles.map(r => `
                <div class="gallery-card">
                    <img src="${r.image}" class="card-img">
                    <div class="card-info">
                        <h4>${r.role}</h4>
                        <p>${r.description}</p>
                    </div>
                </div>
            `).join('');
            navigateTo('page-gallery');
        }

        function backFromGallery() {
            navigateTo(lastPage);
        }

        function handleCredentialResponse(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            myId = payload.sub; myName = payload.name; myAvatar = payload.picture;

            const saved = localStorage.getItem('werewolf_user');
            if (saved) {
                const user = JSON.parse(saved);
                myName = user.name; myAvatar = user.avatar;
            }

            updateProfileUI();
            localStorage.setItem('werewolf_user', JSON.stringify({id: myId, name: myName, avatar: myAvatar}));
            navigateTo('page-dashboard');
        }

        function updateProfileUI() {
            document.getElementById('myName').innerText = myName;
            document.getElementById('myAvatar').src = myAvatar;
            document.getElementById('editName').value = myName;
            document.getElementById('editAvatar').value = myAvatar;
        }

        window.onload = () => {
            const saved = localStorage.getItem('werewolf_user');
            if (saved) {
                const user = JSON.parse(saved);
                myId = user.id; myName = user.name; myAvatar = user.avatar;
                updateProfileUI();
                navigateTo('page-dashboard');
            }
        };

        function toggleEdit(show) {
            document.getElementById('profile-display').style.display = show ? 'none' : 'block';
            document.getElementById('profile-edit').style.display = show ? 'block' : 'none';
        }

        function saveProfile() {
            const nameInput = document.getElementById('editName').value.trim();
            const urlInput = document.getElementById('editAvatar').value.trim();
            const fileInput = document.getElementById('fileAvatar').files[0];

            if (!nameInput) return alert("Vui lòng nhập tên hiển thị!");

            const finalizeSave = (avatarData) => {
                myName = nameInput;
                myAvatar = avatarData;
                localStorage.setItem('werewolf_user', JSON.stringify({id: myId, name: myName, avatar: myAvatar}));
                updateProfileUI();
                toggleEdit(false);
                if (socket?.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({type: "UPDATE_PROFILE", data: JSON.stringify({name: myName, avatar: myAvatar})}));
                }
            };

            if (fileInput) {
                const reader = new FileReader();
                reader.onload = (e) => finalizeSave(e.target.result);
                reader.readAsDataURL(fileInput);
            } else if (urlInput) {
                finalizeSave(urlInput);
            } else {
                finalizeSave(myAvatar); // Giữ nguyên ảnh cũ nếu không đổi
            }
        }

        async function createRoom() {
            const res = await fetch('/create-room', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: myId, name: myName, avatar: myAvatar})});
            setupRoom(await res.json(), true);
        }

        async function joinRoom() {
            const code = document.getElementById('roomCodeInput').value;
            if (!code) return alert("Vui lòng nhập mã phòng!");
            const res = await fetch(`/join-room/${code}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: myId, name: myName, avatar: myAvatar})});
            if (res.ok) {
                setupRoom(await res.json(), false);
                requestMediaPermissions(); // Xin quyền Mic/Loa để chuẩn bị cho Voice Chat
            } else alert("Phòng không tồn tại!");
        }

        async function leaveRoom() {
            if (!currentRoomCode) return;
            await fetch(`/leave-room/${currentRoomCode}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: myId})
            });
            currentRoomCode = null;
            isHost = false;
            if (socket) socket.close();
            navigateTo('page-dashboard');
        }

        // Tích hợp sẵn xin quyền Mic/Loa (Future-proofing)
        async function requestMediaPermissions() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop()); // Tắt mic ngay sau khi xin quyền thành công
                console.log("Quyền Micro và Loa đã sẵn sàng cho bản nâng cấp Voice Chat!");
            } catch (err) {
                console.log("Người dùng từ chối quyền Mic: ", err);
            }
        }

        function setupRoom(room, host) {
            currentRoomCode = room.code; isHost = host;
            document.getElementById('displayRoomCode').innerText = room.code;
            document.getElementById('host-controls').style.display = isHost ? 'block' : 'none';
            document.getElementById('btnReady').style.display = isHost ? 'none' : 'block';
            connectWebSocket(); navigateTo('page-lobby'); refreshPlayers();
            if (isHost) requestMediaPermissions();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/${myId}`);
            socket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === "PLAYER_LIST_UPDATE") updatePlayerListUI(JSON.parse(msg.data));
                else if (msg.type === "YOUR_ROLE") displayMyRole(JSON.parse(msg.data));
                else if (msg.type === "PHASE_UPDATE") handlePhaseUpdate(msg.data);
            };
            socket.onclose = () => setTimeout(connectWebSocket, 1000);
        }

        function toggleReady() {
            if (socket?.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({type: "TOGGLE_READY", data: ""}));
            }
        }

        function updatePlayerListUI(players) {
            document.getElementById('playerList').innerHTML = players.map(p => `
                <div class="player-card ${p.isReady ? 'ready' : ''}">
                    <img src="${p.avatar}">
                    <p style="font-size: 0.7em; margin: 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.name}</p>
                </div>
            `).join('');

            const badge = document.getElementById('player-count-badge');
            const count = players.length;
            const readyCount = players.filter(p => p.isReady).length;

            if (count < 8) {
                badge.innerText = `Cần ít nhất 8 người để bắt đầu. Số người còn thiếu: ${8 - count}`;
                badge.style.background = "#333";
            } else if (readyCount < count) {
                badge.innerText = `Chờ mọi người sẵn sàng (${readyCount}/${count})`;
                badge.style.background = "#f39c12";
            } else {
                badge.innerText = "Đủ người chơi có thể bắt đầu game!";
                badge.style.background = "#27ae60";
            }

            if (isHost) {
                const btn = document.getElementById('btnStartGame');
                if (count >= 8 && readyCount === count) {
                    btn.disabled = false; btn.innerText = "BẮT ĐẦU GAME";
                } else {
                    btn.disabled = true;
                    if (count < 8) btn.innerText = `CẦN THÊM ${8 - count} NGƯỜI`;
                    else btn.innerText = `CHỜ ${count - readyCount} NGƯỜI SẴN SÀNG`;
                }
            } else {
                const myPlayer = players.find(p => p.id === myId);
                const btn = document.getElementById('btnReady');
                if (myPlayer?.isReady) {
                    btn.innerText = "HUỶ SẴN SÀNG";
                    btn.style.background = "#e74c3c";
                } else {
                    btn.innerText = "SẴN SÀNG";
                    btn.style.background = "#2980b9";
                }
            }
        }

        async function refreshPlayers() {
            const res = await fetch(`/room/${currentRoomCode}/players`);
            updatePlayerListUI(await res.json());
        }

        function displayMyRole(role) {
            if (window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]);
            document.getElementById('role-popup').style.display = 'block';

            const roleData = allRoles.find(r => r.role === role.role) || allRoles[1]; // Mặc định là dân nếu ko tìm thấy

            document.getElementById('result').innerHTML = `
                <div class="role-card-big">
                    <img src="${roleData.image}">
                    <div class="role-card-content">
                        <h2 style="color: #d4af37; font-family: 'Georgia', serif; margin: 0;">VAI DIỄN CỦA BẠN</h2>
                        <h1 style="color: ${role.role === 'WEREWOLF' ? '#ff4d4d' : '#4da6ff'}; margin: 10px 0; font-size: 2.5em;">${role.role}</h1>
                        <p style="font-size: 1.1em; line-height: 1.6; color: #bdc3c7; font-style: italic;">"${role.description}"</p>
                        <button id="btnUnderstand" onclick="confirmUnderstand()" style="background: #e74c3c; padding: 20px; font-size: 1.3em; margin-top: 30px; width: 100%;">TÔI ĐÃ HIỂU</button>
                    </div>
                </div>
            `;
        }

        function confirmUnderstand() {
            const btn = document.getElementById('btnUnderstand');
            btn.style.background = '#7f8c8d'; btn.innerText = 'ĐÃ XÁC NHẬN'; btn.disabled = true;
            socket.send(JSON.stringify({type: "I_UNDERSTAND", data: ""}));
        }

        function handlePhaseUpdate(phase) {
            document.getElementById('current-phase').innerText = "Giai đoạn: " + phase;
            if (phase === "PREPARING") startCountdown(300);
            else if (phase === "NIGHT") {
                clearInterval(countdownInterval);
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('role-popup').style.display = 'none';
                document.getElementById('night-overlay').style.display = 'flex';
                if (window.navigator.vibrate) window.navigator.vibrate(500);
            } else {
                document.getElementById('night-overlay').style.display = 'none';
            }

            if (isHost) {
                document.getElementById('host-controls').style.display = phase === "LOBBY" ? "block" : "none";
                document.getElementById('btnNextPhase').style.display = phase !== "LOBBY" ? "block" : "none";
            }
        }

        async function nextPhase() { await fetch(`/room/${currentRoomCode}/next-phase`, {method: 'POST'}); }
        async function distributeRoles() {
            const ratio = document.getElementById('ratioSelect').value;
            const res = await fetch(`/room/${currentRoomCode}/distribute?ratio=${ratio}`);
            if (!res.ok) alert(await res.text());
        }

        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            document.getElementById('timer-display').style.display = 'block';
            document.getElementById('seconds').innerText = timeLeft;
            countdownInterval = setInterval(() => {
                timeLeft--; document.getElementById('seconds').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(countdownInterval); if (isHost) nextPhase(); }
            }, 1000);
        }
    </script>
</body>
</html>
