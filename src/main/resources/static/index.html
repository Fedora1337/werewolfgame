<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Môn Sói Là</title>
    <style>
        :root {
            --primary: #e74c3c; --bg: #0f0f0f; --card: #1a1a1a; --text: #e0e0e0;
            --nav-h: calc(75px + env(safe-area-inset-bottom));
            --header-h: calc(60px + env(safe-area-inset-top));
            --dev-w: 300px;
        }

        body, html {
            margin: 0; padding: 0; height: 100dvh; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        input {
            user-select: text; -webkit-user-select: text;
            padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333;
            background: #222; color: white; font-size: 16px; box-sizing: border-box;
        }

        #app-root { display: flex; width: 100vw; height: 100vh; overflow: hidden; }

        /* DEV SIDEBAR */
        #dev-sidebar {
            width: var(--dev-w); background: #111; border-right: 2px solid #27ae60;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            transition: margin-left 0.3s ease; flex-shrink: 0; z-index: 4000;
            margin-left: calc(-1 * var(--dev-w));
        }
        #dev-sidebar.active { margin-left: 0; }
        #dev-toggle {
            position: fixed; left: 0; top: 50%; transform: translateY(-50%);
            background: #27ae60; width: 35px; height: 60px; display: none;
            align-items: center; justify-content: center; border-radius: 0 10px 10px 0;
            cursor: pointer; z-index: 4001; transition: left 0.3s; color: white;
        }
        body.dev-open #dev-toggle { display: flex; }
        #dev-sidebar.active + #dev-toggle { left: var(--dev-w); }

        /* MAIN CONTENT */
        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; width: 100%; background: var(--bg); }

        header {
            height: var(--header-h); background: rgba(26,26,26,0.95);
            display: flex; align-items: flex-end; justify-content: center;
            border-bottom: 1px solid #333; flex-shrink: 0; backdrop-filter: blur(10px);
            position: relative; width: 100%; padding-bottom: 15px; box-sizing: border-box; z-index: 100;
        }
        header h2 { color: var(--primary); margin: 0; font-size: 1.1em; text-transform: uppercase; letter-spacing: 2px; }

        #scroll-area { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; width: 100%; scroll-behavior: smooth; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; }

        /* HUNT UI COMPONENTS */
        #search-bar-container {
            position: absolute; top: var(--header-h); left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; z-index: 90; display: none;
        }
        #hunt-search { width: 100%; border-radius: 20px; background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 8px 15px; color: white; font-size: 0.9em; }

        #hunt-rank-panel {
            position: absolute; top: 120px; left: 20px; width: 180px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid #444; border-radius: 15px; padding: 10px;
            display: none; flex-direction: column; gap: 8px; z-index: 80;
        }
        .rank-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.75em; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .quick-mark-btn { background: var(--primary); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; cursor: pointer; }

        /* GRID SYSTEM */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; width: 100%; }
        @media (min-width: 1000px) { .game-grid { grid-template-columns: repeat(6, 1fr); } }

        .slot-empty { border: 2px dashed #222; border-radius: 12px; height: 110px; display: flex; align-items: center; justify-content: center; color: #222; }

        .game-player-card {
            background: #2a2a2a; border-radius: 12px; padding: 10px; border: 2px solid #444;
            cursor: pointer; position: relative; height: 110px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.2s; max-width: 140px; margin: 0 auto; width: 100%;
        }
        .game-player-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .game-player-card .player-num { position: absolute; top: 5px; right: 8px; color: #f1c40f; font-size: 0.7em; font-weight: bold; }
        .game-player-card p { font-size: 0.7em; margin: 8px 0 0 0; width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.1; }

        .game-player-card.is-me { border-color: white !important; border-width: 3px; }
        .game-player-card.is-dead { opacity: 0.4; border-color: #222 !important; }
        .game-player-card.is-dead img { filter: grayscale(1); }

        /* TEAMMATE RED UI */
        .game-player-card.is-teammate { border-color: #ff4d4d !important; }
        .game-player-card.is-teammate .player-num { color: #ff4d4d !important; }

        .mark-btn {
            position: absolute; bottom: 5px; background: var(--primary); color: white;
            border-radius: 15px; padding: 4px 10px; font-size: 0.6em; font-weight: bold;
            display: none; z-index: 20; border: 1px solid white;
        }

        /* OVERLAYS */
        #loading-overlay { position: absolute; inset: 0; background: #0f0f0f; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .role-popup { position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 6000; display: none; align-items: center; justify-content: center; }
        #night-overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* NAVBAR */
        nav#bottom-nav { height: var(--nav-h); background: #151515; border-top: 1px solid #333; display: none; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75em; color: #aaa; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; position: relative; }
        .nav-item.active::after { content: ""; position: absolute; bottom: 0; left: 20%; right: 20%; height: 4px; background: var(--primary); border-radius: 4px 4px 0 0; }

        .ghost-btn { background: rgba(255,255,255,0.05) !important; color: var(--primary) !important; border: 1px solid rgba(231, 76, 60, 0.3) !important; }
        .action-overlay-fixed { position: absolute; bottom: 0; left: 0; right: 0; height: 0; pointer-events: none; z-index: 3000; }
        .player-panel { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; }
        .player-panel > * { pointer-events: auto; }
    </style>
</head>
<body>
    <div id="app-root">
        <aside id="dev-sidebar">
            <label style="color:#27ae60; font-size: 0.7em; font-weight: bold; margin-bottom: 10px;">DEVELOPER CONSOLE</label>
            <div id="dev-logs" style="background:black; color:#27ae60; font-family:monospace; padding:10px; flex:1; overflow-y:auto; font-size:0.7em; border-radius:8px; margin-bottom:15px; border:1px solid #222;">> Sẵn sàng...</div>
            <input type="text" id="devConsole" placeholder="Lệnh /..." onkeydown="if(event.key==='Enter') executeDevCommand()">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button onclick="addBot()" style="background:#27ae60; padding:10px; margin:0">+BOT</button>
                <button onclick="devCommand('/next')" style="background:#f39c12; padding:10px; margin:0">NEXT</button>
                <button onclick="devCommand('/start')" style="background:#2980b9; padding:10px; margin:0">START</button>
                <button onclick="location.reload()" style="background:#555; padding:10px; margin:0">REFRESH</button>
            </div>
        </aside>
        <div id="dev-toggle" onclick="toggleDevBar()">⚙️</div>

        <div id="main-content">
            <div id="loading-overlay">
                <div class="spinner" style="width:50px; height:50px; border:4px solid #1a1a1a; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite;"></div>
                <h3 style="color:var(--primary); margin-top:20px; letter-spacing:2px; font-size:0.9em;">ĐANG KẾT NỐI<span class="dots"></span></h3>
            </div>

            <div id="search-bar-container">
                <input type="text" id="hunt-search" placeholder="Tìm mồi: #số hoặc @tên..." oninput="handleHuntSearch(this.value)">
            </div>

            <div id="hunt-rank-panel">
                <label style="font-size:0.6em; color:#f1c40f; font-weight:bold; margin-bottom:5px;">BẢNG SĂN MỒI</label>
                <div id="rank-list" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div id="role-popup" class="role-popup"></div>
            <div id="night-overlay">
                <h1 style="font-size:5em; margin:0;">🌑</h1>
                <h2 style="color:var(--primary); letter-spacing:3px; margin-top:20px;">TRỜI TỐI RỒI...</h2>
                <p id="night-overlay-sub" style="color:#444; font-style:italic;">Làng đang chìm trong giấc ngủ</p>
            </div>

            <header>
                <div id="back-btn" onclick="goBack()" style="position:absolute; left:15px; bottom:15px; cursor:pointer; display:none; font-size:1.5em;">←</div>
                <div id="header-status-left" style="position:absolute; left:55px; bottom:18px; display:none; align-items:center; gap:6px; font-size:0.7em; color:#f1c40f; font-weight:bold;">
                    <span id="header-phase-icon"></span> <span id="header-phase-text"></span>
                    <div id="night-turn-indicator" style="margin-left:10px; background:rgba(231,76,60,0.2); padding:2px 8px; border-radius:4px; border:1px solid var(--primary); color:var(--primary); display:none;">Lượt của \NONE</div>
                </div>
                <h2>Môn Sói Là</h2>
                <div id="header-status-right" style="position:absolute; right:85px; bottom:18px; display:none; align-items:center; gap:6px; font-size:0.7em; color:var(--primary); font-family:monospace; font-weight:bold;">
                    <span>🕒</span> <span id="header-timer">00:00</span>
                </div>
                <div style="position:absolute; right:15px; bottom:15px; display:flex; gap:15px; align-items:center;">
                    <div onclick="showDevLogin()" style="opacity:0.00005; cursor:pointer;">🛠️</div>
                    <div onclick="toggleFullscreen()" style="opacity:0.5; cursor:pointer; font-size:1.2em;">⛶</div>
                </div>
            </header>

            <main id="scroll-area">
                <div class="container">
                    <div id="page-home" class="page active"><div id="home-auth-section" class="card" style="text-align:center;"><h3>Đang tải...</h3></div></div>
                    <div id="page-dashboard" class="page"><div class="card"><h3>Chào, <span id="dash-name" style="color:var(--primary)">User</span>!</h3></div><button onclick="createRoom()" class="secondary-btn">TẠO PHÒNG MỚI</button><input type="text" id="roomCodeInput" placeholder="Mã phòng..."><button onclick="joinRoom()">GIA NHẬP PHÒNG</button></div>
                    <div id="page-profile" class="page">
                        <div class="card" style="align-items:center; display:flex; flex-direction:column;">
                            <div style="position:relative; cursor:pointer;" onclick="toggleAvatarEdit()">
                                <img id="profile-ava-preview" src="" width="200" height="200" style="border-radius:50%; border:5px solid var(--primary); object-fit:cover; transition: border-radius 0.3s;">
                                <div style="position:absolute; bottom:10px; right:10px; background:var(--primary); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:3px solid var(--card);">📷</div>
                            </div>
                            <div id="avatar-options" style="display:none; flex-direction:column; gap:10px; margin-top:20px; width:100%;">
                                <input type="file" id="fileAvatar" onchange="previewFileAvatar(this)">
                                <input type="text" id="editAvatar" placeholder="URL ảnh...">
                                <button onclick="toggleAvatarEdit()" class="ghost-btn">Đóng</button>
                            </div>
                            <input type="text" id="editName" placeholder="Tên hiển thị">
                            <button onclick="saveProfile()" style="background:#27ae60; width:100%;">LƯU HỒ SƠ</button>
                            <button onclick="logout()" style="background:#e74c3c; width:100%;">ĐĂNG XUẤT</button>
                        </div>
                    </div>
                    <div id="page-lobby" class="page">
                        <div class="card" style="flex:1; overflow-y:auto; margin-bottom:80px;">
                            <h2>Mã: <span id="displayRoomCode" style="color:#f1c40f">######</span></h2>
                            <div id="player-count-badge" style="background:#333; padding:5px 10px; border-radius:10px; font-size:0.8em; margin-bottom:10px;">Đang chờ...</div>
                            <div id="game-grid" class="game-grid"></div>
                        </div>
                    </div>
                    <div id="page-gallery" class="page">
                        <h2 style="color:#f1c40f; margin-bottom:30px;">Bộ Bài</h2>
                        <div id="gallery-villagers" class="gallery-grid"></div>
                        <div id="gallery-wolves" class="gallery-grid"></div>
                        <div id="gallery-3rd" class="gallery-grid"></div>
                    </div>
                    <div id="page-dev-login" class="page"><div class="card"><h3>Admin</h3><input type="password" id="devPassword"><button onclick="checkDevPassword()">Kích hoạt</button></div></div>
                </div>
            </main>

            <nav id="bottom-nav">
                <div id="nav-dash" class="nav-item active" onclick="navigateTo('page-dashboard')"><span>🏠</span>Sảnh</div>
                <div id="nav-gall" class="nav-item" onclick="navigateTo('page-gallery')"><span>📖</span>Bộ bài</div>
                <div id="nav-prof" class="nav-item" onclick="navigateTo('page-profile')"><span>👤</span>Hồ sơ</div>
            </nav>

            <div class="action-overlay-fixed">
                <div id="host-action-bar" class="host-action-bar">
                    <select id="ratioSelect" style="background:#222; color:white; border-radius:8px; padding:5px;"><option value="0.25">Newbie</option><option value="0.33">Standard</option></select>
                    <button id="btnStartGame" onclick="distributeRoles()" style="background:#27ae60; padding:10px;">BẮT ĐẦU</button>
                    <button id="btnNextPhase" onclick="nextPhase()" style="display:none; background:#f39c12; padding:10px;">TIẾP TỤC</button>
                </div>
                <div class="player-panel">
                    <div id="lobby-controls" style="display:none; flex-direction:column; gap:8px; width:140px;">
                        <button id="btnReady" onclick="toggleReady()" style="background:#2980b9;">SẴN SÀNG</button>
                        <button onclick="goBack()" class="ghost-btn">RỜI PHÒNG</button>
                    </div>
                    <div id="role-badge-mini" class="role-badge-mini" onclick="displayMyRole(myRoleData)"></div>
                    <div class="self-card-mini"><img id="self-mini-ava" src=""><div><h5 id="self-mini-num">#0</h5><p id="self-mini-name">User</p></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myId, myName, myAvatar, realId, realName, realAvatar, currentRoomCode, isHost = false, socket = null, countdownInterval = null, lastPage = 'page-home', isDev = false, selectedPlayerId = null, myRoleData = null, playersCache = [], currentViewerIndex = 0, displayRoles = [], currentPhase = 'LOBBY', hasMarkedThisNight = false;

        const allRoles = [
            { role: 'WEREWOLF', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thewerewolf.png', description: 'Ma Sói - Ăn thịt dân làng.' },
            { role: 'VILLAGER', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thevillager.png', description: 'Dân Làng - Bảo vệ ngôi làng.' },
            { role: 'SEER', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/theseer.png', description: 'Tiên Tri - Soi phe 1 người.' },
            { role: 'GUARDIAN', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/theguardian.png', description: 'Bảo Vệ - Miễn nhiễm Sói đêm đó.' },
            { role: 'WITCH', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thewitch.png', description: 'Phù Thủy - Độc và Cứu.' },
            { role: 'HUNTER', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thehunter.png', description: 'Thợ Săn - Kéo theo người chết cùng.' },
            { role: 'RUSSIAN', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/therussianpng.png', description: 'Người Nga - Gấu báo Sói.' },
            { role: 'THREE_BROTHERS', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thethreebrothers.png', description: '3 Anh Em.' },
            { role: 'TWINS', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thetwins.png', description: '2 Chị Em.' },
            { role: 'CUPID', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thecupid.png', description: 'Cupid - Ghép đôi.' },
            { role: 'CELESTIAL_FOX', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thecelestialfox.png', description: 'Hồ Ly - Soi 3 người.' },
            { role: 'MOON_MAIDEN', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/themoonmaiden.png', description: 'Nguyệt Nữ - Khóa chức năng.' },
            { role: 'PIPER', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thepiper.png', description: 'Thổi Sáo - Thôi miên.' },
            { role: 'ELDER', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/theelder.png', description: 'Già Làng - Giáp 1 mạng.' },
            { role: 'CURSER_WEREWOLF', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thecurserwerewolf.png', description: 'Sói Nguyền - Biến nạn nhân thành Sói.' },
            { role: 'PROPHET_WEREWOLF', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/theprophetwerewolf.png', description: 'Sói Tiên Tri - Soi chức năng.' },
            { role: 'DERP_WOLF', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thederpwolf.png', description: 'Sói Ngu.' },
            { role: 'LYCAN', image: 'https://raw.githubusercontent.com/Fedora1337/werewolfgame/main/src/card/roles/thelycan.png', description: 'Bán Sói.' }
        ];

        async function getCachedImageUrl(url) { if (!('caches' in window)) return url; const cache = await caches.open('monsoila-assets-v1'); const response = await cache.match(url); if (response) { const b = await response.blob(); return URL.createObjectURL(b); } return url; }
        async function preloadImages() { if (!('caches' in window)) return; const cache = await caches.open('monsoila-assets-v1'); allRoles.forEach(r => { cache.match(r.image).then(m => { if (!m) cache.add(r.image).catch(e => {}); }); }); }
        function showLoading(t, s) { const o = document.getElementById('loading-overlay'); o.style.display='flex'; o.querySelector('h3').innerText=t; }
        function hideLoading() { const o = document.getElementById('loading-overlay'); o.style.display='none'; }

        function navigateTo(pId, updateHistory = true) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(pId).classList.add('active');
            const b = document.getElementById('back-btn'); b.style.display = (pId==='page-home'||pId==='page-dashboard')?'none':'block';
            if(pId!=='page-gallery'&&pId!=='page-lobby') lastPage=pId;
            const nav=document.getElementById('bottom-nav'); nav.style.display = (pId==='page-lobby'||pId==='page-home')?'none':'grid';
            if(pId==='page-gallery') showGallery();
            updateProfileUI();
            if (updateHistory) {
                let path = pId === 'page-lobby' ? `/lobby/code=${currentRoomCode}` : Object.keys(routes).find(k=>routes[k]===pId) || '/home';
                history.pushState({ pageId: pId, roomCode: currentRoomCode }, '', path);
            }
        }

        function updatePlayerListUI(ps) {
            playersCache = ps; const g = document.getElementById('game-grid');
            const me = ps.find(p => p.id === myId); if (me) isHost = me.isHost;
            const isWolfRole = (r) => r && ["WEREWOLF", "CURSER_WEREWOLF", "PROPHET_WEREWOLF", "LYCAN"].includes(r.toUpperCase());
            const myR = myRoleData ? (typeof myRoleData.role === 'string' ? myRoleData.role : myRoleData.role.name) : "";
            const iAmWolf = isWolfRole(myR);

            // SPECIAL SORTING FOR HUNT PHASE
            let sortedPs = [...ps];
            if (currentPhase === "WEREWOLF" || currentPhase === "CURSER_WEREWOLF" || currentPhase === "PROPHET_WEREWOLF") {
                sortedPs.sort((a,b) => {
                    if (a.isDead !== b.isDead) return a.isDead ? 1 : -1;
                    const aWolf = isWolfRole(a.role); const bWolf = isWolfRole(b.role);
                    if (aWolf !== bWolf) return aWolf ? 1 : -1;
                    return b.werewolfMark - a.werewolfMark;
                });
                document.getElementById('search-bar-container').style.display = 'block';
                if (iAmWolf) document.getElementById('hunt-rank-panel').style.display = 'flex';
                updateHuntRankList(sortedPs);
            } else {
                document.getElementById('search-bar-container').style.display = 'none';
                document.getElementById('hunt-rank-panel').style.display = 'none';
            }

            g.innerHTML = sortedPs.map((p,i) => {
                const isWolf = isWolfRole(p.role);
                const showTeammate = iAmWolf && isWolf;
                return `
                <div id="player-card-${p.id}" class="game-player-card ${p.id===myId?'is-me':''} ${p.isDead?'is-dead':''} ${showTeammate?'is-teammate':''}"
                     onclick="handleCardClick('${p.id}')" ondblclick="handleCardDblClick('${p.id}')">
                    ${isHost && currentPhase==='LOBBY' && p.id!==myId ? `<div class="kick-btn" onclick="kickPlayer('${p.id}')">×</div>` : ''}
                    <div class="player-num">${p.isDead ? '#DIE' : '#'+(ps.indexOf(p)+1)}</div>
                    <img src="${p.avatar}">
                    <p>${p.name}</p>
                    <div id="mark-btn-${p.id}" class="mark-btn" onclick="markTarget('${p.id}')">ĐÁNH DẤU</div>
                </div>`;
            }).join('') + Array.from({length: Math.max(0, 18-ps.length)}).map((_,i)=>`<div class="slot-empty">${ps.length+i+1}</div>`).join('');

            document.getElementById('lobby-controls').style.display = currentPhase === 'LOBBY' ? 'flex' : 'none';
            document.getElementById('host-action-bar').style.display = (isHost && currentPhase==='LOBBY') ? 'flex' : 'none';
        }

        function handleCardClick(id) {
            if (hasMarkedThisNight) return;
            document.querySelectorAll('.mark-btn').forEach(b => b.style.display = 'none');
            const btn = document.getElementById(`mark-btn-${id}`);
            if (btn) btn.style.display = 'block';
        }

        function handleCardDblClick(id) {
            if (hasMarkedThisNight) return;
            markTarget(id);
        }

        function markTarget(id) {
            if (hasMarkedThisNight) return;
            socket.send(JSON.stringify({type: "WEREWOLF_VOTE", data: id}));
            hasMarkedThisNight = true;
            document.querySelectorAll('.mark-btn').forEach(b => b.style.display = 'none');
            showNotification("Đã đánh dấu mục tiêu!");
        }

        function updateHuntRankList(ps) {
            const list = document.getElementById('rank-list');
            const ranked = ps.filter(p => !p.isDead && p.werewolfMark > 0).sort((a,b) => b.werewolfMark - a.werewolfMark);
            list.innerHTML = ranked.map(p => `
                <div class="rank-item">
                    <span>#${playersCache.indexOf(p)+1} ${p.name} (${p.werewolfMark})</span>
                    ${!hasMarkedThisNight ? `<span class="quick-mark-btn" onclick="markTarget('${p.id}')">CẮN</span>` : ''}
                </div>
            `).join('') || "<p style='font-size:0.6em; color:#666;'>Chưa có ai bị nhắm...</p>";
        }

        function handleHuntSearch(val) {
            if (!val) return;
            let target = null;
            if (val.startsWith('#')) {
                const idx = parseInt(val.substring(1)) - 1;
                target = playersCache[idx];
            } else if (val.startsWith('@')) {
                const name = val.substring(1).toLowerCase();
                target = playersCache.find(p => p.name.toLowerCase().includes(name));
            }
            if (target) {
                const el = document.getElementById(`player-card-${target.id}`);
                if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
            }
        }

        function handlePhaseUpdate(data) {
            const [ph, du, rs, day, tick] = data.split('|');
            if (currentPhase !== ph) {
                hasMarkedThisNight = false; // Reset marking flag
                // Transition effects
                const transitionMap = { "LOBBY-PREPARING": "TRÒ CHƠI BẮT ĐẦU", "PREPARING-NIGHT": "ĐÊM 1 BẮT ĐẦU", "NIGHT-DAY": `NGÀY ${day} ĐẾN` };
                const text = transitionMap[`${currentPhase}-${ph}`] || (ph === "DAY" ? `BÌNH MINH NGÀY ${day}` : "");
                if (text) {
                    const o = document.createElement('div');
                    o.style.cssText = 'position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:10000; display:flex; align-items:center; justify-content:center; animation: fadeIn 0.5s ease, fadeOut 0.5s ease 2s forwards; pointer-events:none;';
                    o.innerHTML = `<h1 style="color:var(--primary); letter-spacing:5px; text-shadow:0 0 20px red;">${text}</h1>`;
                    document.getElementById('main-content').appendChild(o); setTimeout(()=>o.remove(), 2500);
                }
            }
            currentPhase = ph;
            const isNight = ph !== "LOBBY" && ph !== "DAY" && !ph.includes("TRIAL");
            document.getElementById('night-overlay').style.display = (isNight && !canISee()) ? 'flex' : 'none';
            document.getElementById('header-status-left').style.display = ph==='LOBBY'?'none':'flex';
            document.getElementById('header-status-right').style.display = ph==='LOBBY'?'none':'flex';
            updatePlayerListUI(playersCache);
            startCountdown(parseInt(du), parseInt(tick)||1);
        }

        function canISee() {
            if (!myRoleData) return false;
            const r = (typeof myRoleData.role === 'string' ? myRoleData.role : myRoleData.role.name).toUpperCase();
            if (r === currentPhase) return true;
            if (currentPhase === "WEREWOLF" && ["CURSER_WEREWOLF", "PROPHET_WEREWOLF", "LYCAN"].includes(r)) return true;
            return false;
        }

        async function displayMyRole(role) {
            myRoleData = role; document.getElementById('role-badge-mini').style.display = 'block'; document.getElementById('role-badge-mini').innerText = (role.role||role).replace(/_/g,' ');
            const p = document.getElementById('role-popup'); p.innerHTML = ''; p.style.display = 'flex';
            const r = allRoles.find(x => x.role === (role.role||role)) || allRoles[1];
            const url = await getCachedImageUrl(r.image);
            p.innerHTML = `<div class="viewer-content"><div class="viewer-card" id="myRoleCard"><div class="viewer-back"></div><div class="viewer-front"><img src="${url}"><div class="viewer-info"><h3>VAI DIỄN</h3><h2 style="color:${(role.role||role).includes('WOLF')?'#f44':'#4da6ff'}">${(role.role||role).replace(/_/g,' ')}</h2><p>"${r.description}"</p><button onclick="confirmUnderstand()" style="background:var(--primary); width:100%;">XÁC NHẬN</button></div></div></div></div>`;
            setTimeout(()=>document.getElementById('myRoleCard').classList.add('flipped'), 100);
        }

        function confirmUnderstand() { document.getElementById('myRoleCard').classList.remove('flipped'); setTimeout(()=>document.getElementById('role-popup').style.display='none', 600); socket.send(JSON.stringify({type:"I_UNDERSTAND", data:""})); }
        function startCountdown(s, t) { clearInterval(countdownInterval); let c=s; const up = () => { const m=Math.floor(c/60).toString().padStart(2,'0'), sc=(c%60).toString().padStart(2,'0'); document.getElementById('header-timer').innerText = t===0?"PAUSED":`${m}:${sc}`; }; up(); if(t>0) countdownInterval=setInterval(()=>{c--; up(); if(c<=0){clearInterval(countdownInterval); if(isHost) nextPhase();}}, 1000/t); }
        function connectWebSocket() { socket = new WebSocket(`${window.location.protocol==='https:'?'wss:':'ws:'}//${window.location.host}/ws/${myId}`); socket.onmessage=(e)=>{ const m=JSON.parse(e.data); if(m.type==="PLAYER_LIST_UPDATE") updatePlayerListUI(JSON.parse(m.data)); else if(m.type==="YOUR_ROLE") displayMyRole(JSON.parse(m.data)); else if(m.type==="PHASE_UPDATE") handlePhaseUpdate(m.data); else if(m.type==="WINNER") showWinnerOverlay(m.data); else if(m.type==="KICKED"){ showNotification(m.data); setTimeout(()=>location.reload(), 2000); } }; }
        function executeDevCommand() { const i=document.getElementById('devConsole'), c=i.value.trim(); if(c.startsWith('/access')){ /* logic access */ } else if(c==='/return'){ /* logic return */ } else if(socket?.readyState===1) socket.send(JSON.stringify({type:"DEV_COMMAND", data:c})); i.value=''; }
        function toggleDevBar() { document.getElementById('dev-sidebar').classList.toggle('active'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        async function createRoom() { const r=await fetch('/create-room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:myId,name:myName,avatar:myAvatar})}); setupRoom(await r.json(),true); }
        async function joinRoom() { const c=document.getElementById('roomCodeInput').value; const r=await fetch(`/join-room/${c}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:myId,name:myName,avatar:myAvatar})}); if(r.ok) setupRoom(await r.json(),false); }
        async function setupRoom(r,h) { currentRoomCode=r.code; isHost=h; currentPhase=r.phase; document.getElementById('displayRoomCode').innerText=r.code; connectWebSocket(); navigateTo('page-lobby'); }
        async function distributeRoles() { fetch(`/room/${currentRoomCode}/distribute?ratio=${document.getElementById('ratioSelect').value}`); }
        async function nextPhase() { fetch(`/room/${currentRoomCode}/next-phase`,{method:'POST'}); }
        window.onload=()=>{ const s=localStorage.getItem('werewolf_user'); if(s){ const u=JSON.parse(s); myId=u.id; myName=u.name; myAvatar=u.avatar; } realId=myId; realName=myName; realAvatar=myAvatar; updateHomeUI(); handleInitialRoute(); preloadImages(); hideLoading(); };
    </script>
</body>
</html>
